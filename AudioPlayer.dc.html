<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:12px;width:100%">
<audio ref="{{ audioRef }}" preload="metadata" src="{{ src }}"></audio>
<button type="button" onClick="{{ toggle }}" aria-label="Reproduzir" style="flex:none;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;background:var(--color-accent);display:grid;place-items:center;transition:background .18s ease" style-hover="background:var(--color-accent-600)">
  <sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#F8F6F1"><rect x="6" y="5" width="4" height="14" rx="1.2"></rect><rect x="14" y="5" width="4" height="14" rx="1.2"></rect></svg>
  </sc-if>
  <sc-if value="{{ paused }}" hint-placeholder-val="{{ true }}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#F8F6F1" style="margin-left:2px"><path d="M8 5v14l11-7z"></path></svg>
  </sc-if>
</button>
<div onClick="{{ seek }}" ref="{{ trackRef }}" style="flex:1;min-width:0;height:8px;border-radius:999px;background:var(--color-accent-200);cursor:pointer;position:relative">
  <div style="position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--color-accent);width:{{ pct }}%"></div>
  <div style="position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--color-accent);box-shadow:0 1px 4px color-mix(in srgb,#303030 30%,transparent);left:{{ pct }}%"></div>
</div>
<span style="flex:none;font-size:13px;font-weight:600;color:color-mix(in srgb,var(--color-text) 66%,transparent);font-variant-numeric:tabular-nums;min-width:74px;text-align:right">{{ timeLabel }}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;420&quot;,&quot;height&quot;:&quot;44&quot;},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { playing: false, cur: 0, dur: 0 };
  constructor(p){ super(p); this.audio = React.createRef(); this.track = React.createRef(); }
  componentDidMount(){
    const a = this.audio.current;
    if(!a) return;
    this._on = () => this.setState({ cur: a.currentTime || 0 });
    this._meta = () => this.setState({ dur: a.duration || 0 });
    this._end = () => this.setState({ playing: false, cur: 0 });
    this._pause = () => this.setState({ playing: false });
    this._play = () => this.setState({ playing: true });
    a.addEventListener('timeupdate', this._on);
    a.addEventListener('loadedmetadata', this._meta);
    a.addEventListener('ended', this._end);
    a.addEventListener('pause', this._pause);
    a.addEventListener('play', this._play);
  }
  componentWillUnmount(){
    const a = this.audio.current;
    if(a){ a.removeEventListener('timeupdate', this._on); a.removeEventListener('loadedmetadata', this._meta); a.removeEventListener('ended', this._end); a.removeEventListener('pause', this._pause); a.removeEventListener('play', this._play); a.pause(); }
  }
  fmt(t){ t = Math.max(0, Math.floor(t||0)); const m = Math.floor(t/60), s = t%60; return m + ':' + String(s).padStart(2,'0'); }
  toggle = () => {
    const a = this.audio.current; if(!a) return;
    if(a.paused){
      document.querySelectorAll('audio').forEach(el => { if(el !== a) el.pause(); });
      a.play(); this.setState({ playing: true });
    }
    else { a.pause(); this.setState({ playing: false }); }
  };
  seek = (e) => {
    const a = this.audio.current, t = this.track.current; if(!a || !t || !a.duration) return;
    const r = t.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    a.currentTime = frac * a.duration;
    this.setState({ cur: a.currentTime });
  };
  renderVals(){
    const { playing, cur, dur } = this.state;
    return {
      src: this.props.src || '',
      audioRef: this.audio,
      trackRef: this.track,
      toggle: this.toggle,
      seek: this.seek,
      playing,
      paused: !playing,
      pct: dur > 0 ? (cur / dur) * 100 : 0,
      timeLabel: this.fmt(cur) + ' / ' + this.fmt(dur)
    };
  }
}
</script>
</body>
</html>
